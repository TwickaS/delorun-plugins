<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>security-audit pane</title>
<link rel="stylesheet" href="./app.css">
<style>
  /* The stub primitives' own chrome, drawn with the same design tokens. */
  .st-btn {
    display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box;
    border: 0.5px solid transparent; border-radius: var(--dsw-radius-sm);
    font: inherit; font-size: 12px; line-height: 16px; cursor: pointer;
    color: var(--dsw-alias-label-primary); background: transparent;
  }
  .st-sm { height: 24px; padding: 0 8px; }
  .st-md { height: 36px; padding: 0 12px; }
  .st-outline { border-color: var(--dsw-alias-border-l3); }
  .st-ghost { color: var(--dsw-alias-label-secondary); }
  .st-btn:disabled { opacity: 0.5; cursor: default; }
  .st-tag {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 8px;
    font-size: 11px; line-height: 17px; font-weight: 500; white-space: nowrap;
    color: var(--dsw-alias-label-tertiary);
  }
  .st-tag[data-tone='outline'] { border: 0.5px solid var(--dsw-alias-border-l4); }
  .st-tag[data-tone='neutral'] { background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); }
  .st-tag[data-tone='success'] { background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 10%, transparent); color: var(--dsw-alias-state-success-primary); }
  .st-tag[data-tone='info'] { background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 10%, transparent); color: var(--dsw-alias-state-business-primary); }
  .st-tag[data-tone='warning'] { background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 12%, transparent); color: var(--dsw-alias-state-warn-primary); }
  .st-tag[data-tone='danger'] { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 10%, transparent); color: var(--dsw-alias-state-error-primary); }
  .st-input-wrap { display: block; flex: 1 1 auto; min-width: 0; }
  .st-input {
    box-sizing: border-box; width: 100%; height: 28px; padding: 0 8px; font: inherit; font-size: 12px;
    color: var(--dsw-alias-label-primary); background: var(--dsw-alias-bg-layer-1);
    border: 0.5px solid var(--dsw-alias-border-l3); border-radius: var(--dsw-radius-sm);
  }
  .st-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--dsw-radius-sm); background: var(--dsw-alias-interactive-bg-hover); }
  .st-seg-tab { border: 0; border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-secondary); background: transparent; cursor: pointer; }
  .st-seg-tab[aria-selected='true'] { background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary); }

  /* The studio frame: the pane sits in a right sidebar at desktop width. */
  html, body { margin: 0; height: 100%; font-family: var(--dsw-font-family-sans, system-ui, sans-serif); }
  .frame { display: flex; height: 100vh; background: var(--dsw-alias-bg-base); }
  .sidebar { display: flex; flex: none; width: 380px; margin-left: auto; height: 100vh; box-sizing: border-box;
    border-left: 0.5px solid var(--dsw-alias-border-l3); background: var(--dsw-alias-bg-base); }
  @media (max-width: 520px) { .sidebar { width: 100%; border-left: 0; } }
  #pane { display: flex; flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="frame"><div class="sidebar"><div id="pane"></div></div></div>
<script type="module" src="./out/harness.js"></script>
</body>
</html>
