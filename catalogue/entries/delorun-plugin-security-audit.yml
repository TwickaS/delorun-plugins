# The catalogue entry for the Security audit plugin. The file name is the package name.
package: delorun-plugin-security-audit
title: Security audit
description: A coverage-led repository audit that runs Cloudflare's security-audit skill through Delorun's own confinement, delegation and studio surfaces.
repository: https://github.com/TwickaS/delorun-plugins
license: MIT
author:
  name: Delorun
  github: TwickaS
versions:
  - version: 0.1.0
    integrity: sha512-b6U7K9sQdOCFyHVB5C4rE4Oy8K5/roKkzTmNGSiulVDKu+HC1BvBaAIqBFDTtefv6nUWgF9HBQmVkXg4F8l7BA==
    engines:
      dsh: ^0.2.2-rc.3
      delorun: ">=0.1.0-0"
    findings:
      - id: writes-run-directory
        severity: info
        title: Writes a run directory in the audited workspace
        detail: A run writes .security-audit/run-<N>/ in the audited workspace, holding the shared report files and one scratch directory for each agent it starts. The workspace's version control must ignore that directory; the plugin refuses to start when it does not.
        author:
          role: plugin-author
          name: Delorun
          github: TwickaS
        reported: 2026-11-24
      - id: starts-agents-and-commands
        severity: low
        title: Starts agent sessions that read the target and run local commands
        detail: Each phase delegates to agent sessions that read the audited source and may run bounded local checks. Commands run inside Delorun's sandbox, confined to the agent's own scratch directory, and the plugin refuses a workspace whose network setting is not Off or whose permission preset is full access. The plugin itself makes no network request.
        author:
          role: plugin-author
          name: Delorun
          github: TwickaS
        reported: 2026-11-24
